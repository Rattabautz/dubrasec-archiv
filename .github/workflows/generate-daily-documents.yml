name: Generate DubraSec daily DOCX and PDF
on:
  push:
    paths:
      - 'Tagesberichte/*_Security_Intelligence.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-docx reportlab
      - run: python scripts/build_archive_documents.py
      - name: Commit generated documents
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Tagesberichte/DubraSec_Tagesbericht_*.docx Tagesberichte/DubraSec_Tagesbericht_*.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Generate daily DOCX and PDF documents'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
