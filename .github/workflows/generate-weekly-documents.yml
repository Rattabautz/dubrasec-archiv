name: Generate DubraSec weekly DOCX and PDF
on:
  push:
    paths:
      - 'Wochenberichte/*_Security_Intelligence.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-docx reportlab
      - name: Build latest weekly report
        run: |
          LATEST=$(find Wochenberichte -maxdepth 1 -name '????-??-??_Security_Intelligence.md' | sort | tail -n 1)
          test -n "$LATEST"
          python scripts/build_archive_documents.py "$LATEST"
      - name: Commit weekly DOCX and PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Wochenberichte/DubraSec_Wochenbericht_*.docx Wochenberichte/DubraSec_Wochenbericht_*.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Generate weekly DOCX and PDF'
            git push
          fi
