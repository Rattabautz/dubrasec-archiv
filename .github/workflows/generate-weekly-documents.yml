name: Generate DubraSec weekly DOCX and PDF
on:
  push:
    paths:
      - 'Wochenberichte/*_Security_Intelligence.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-docx reportlab
      - run: python scripts/build_archive_documents.py Wochenberichte/2026-10-25_Security_Intelligence.md
      - name: Commit weekly DOCX and PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Wochenberichte/DubraSec_Wochenbericht_KW43_2026.docx Wochenberichte/DubraSec_Wochenbericht_KW43_2026.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Generate weekly DOCX and PDF KW43'
            git push
          fi
